<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">
        <h1>To-Do List  </h1>
        <div class="search-div">
            <input id="input-box" type="text" name="list" id="list">
            <button class="search-button" onclick="addTask()"  id="add-item" >
                Add
            </button>
        </div>
        <div class="list-div">
            <ul id="list-container">
            </ul>
        </div>
    </div>
<script src="script.js" ></script>
</body>
</html>
